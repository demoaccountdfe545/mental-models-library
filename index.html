<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mental Models Library</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script><style>
:root{font-family:Inter,system-ui,-apple-system,Arial,sans-serif;color:#22302c;background:#fafaf8}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}.primary{background:#214d3f;color:white;border:0;padding:13px 18px;border-radius:12px}.outline{background:white;border:1px solid #ddd;padding:10px 15px;border-radius:12px;color:#273630}.wrap{max-width:1200px;margin:auto;padding:28px}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;padding:18px max(24px,calc((100vw - 1200px)/2));background:white;gap:12px}.brand{font-weight:800;letter-spacing:.07em;font-size:15px}.tabs{display:flex;gap:10px;flex-wrap:wrap}.tabs button{padding:8px 14px;background:transparent;border:0;border-radius:9px}.tabs .active{background:#e9f3ed}.muted{color:#77807c}.eyebrow{font-size:12px;letter-spacing:.16em;color:#638778;font-weight:700}.hero h1{font-size:clamp(26px,4.5vw,44px);letter-spacing:-.05em;margin:12px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0 32px}.stat,.panel{border:1px solid #ebece8;background:white;border-radius:17px;padding:22px}.stat strong{display:block;font-size:29px;margin-top:12px}.bar{height:7px;background:#e9eee8;border-radius:6px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;background:#478d6b}.books{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.book{background:none;border:0;text-align:left;padding:0}.cover{height:280px;position:relative;background:linear-gradient(155deg,#fff,var(--tone));border:1px solid #e7e9e6;border-radius:14px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}.cover:after{content:'✦';font-size:110px;color:var(--accent);opacity:.48;position:absolute;top:23%;right:25%}.cover h3{z-index:1;font-size:25px;line-height:1.1;letter-spacing:-.04em;margin:0}.cover small{font-size:10px;letter-spacing:.11em;z-index:1}.book>p{font-weight:700;margin:10px 1px 4px}.book>span{font-size:13px;color:#76817b}.locked .cover{filter:saturate(.4)}.login{max-width:450px;margin:12vh auto;background:white;border:1px solid #ddd;border-radius:25px;padding:40px}.login h1{letter-spacing:-.05em;font-size:35px}.login input,.panel input,.panel select{display:block;width:100%;border:1px solid #d8ddd9;background:white;border-radius:10px;padding:13px;margin:10px 0}.login .primary{width:100%;margin-top:13px}.readerBar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:22px}.readerLayout{display:grid;grid-template-columns:240px 1fr;gap:20px}.toc button{display:block;width:100%;text-align:left;padding:11px 10px;background:none;border:0;border-radius:10px;color:#5d6864}.toc button.active{background:#e9f3ed;color:#194b38;font-weight:700}.paper{max-width:760px;margin:0 auto;min-height:65vh;background:white;padding:clamp(25px,5vw,65px);border:1px solid #eee;border-radius:17px;box-shadow:0 12px 45px #172e1710}.paper h1{font-family:Georgia,serif;font-size:clamp(30px,4vw,45px);margin:12px 0 30px}.chapter{font-family:Georgia,serif;line-height:1.8;color:#293530}.chapter h2{line-height:1.25}.readerFoot{display:flex;justify-content:space-between;margin:20px auto;max-width:760px}.question{background:white;padding:22px;border:1px solid #e7eae6;border-radius:15px;margin:15px 0}.option{display:block;border:1px solid #eee;padding:13px;border-radius:10px;margin-top:10px}.option input{margin-right:9px}.listRow{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:15px 0;gap:10px;align-items:center}.perm{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.perm label{padding:12px;border:1px solid #eee;border-radius:9px}.message{background:#fff8df;padding:10px;border-radius:10px;margin:16px 0}.hide{display:none!important}@media(max-width:750px){.top{padding:14px}.wrap{padding:18px}.brand{font-size:12px}.tabs{gap:0}.tabs button{font-size:12px;padding:8px}.books{grid-template-columns:repeat(2,1fr);gap:14px}.cover{height:240px}.cover h3{font-size:20px}.stats{gap:7px}.stat{padding:12px}.stat strong{font-size:23px}.readerLayout{display:block}.toc{display:flex;overflow:auto;white-space:nowrap;margin-bottom:14px;gap:8px}.toc button{width:auto;border:1px solid #eee}.paper{min-height:65vh}.perm{grid-template-columns:1fr}.stat .muted{font-size:11px}}
</style></head><body><div id="app"></div><script>
const SB='https://qlsroeshnpjmsoewsuvt.supabase.co',PK='sb_publishable_aOyEDoPUZBmOJnRPK_Y9RQ_7_750odn';const db=supabase.createClient(SB,PK);let state={session:null,profile:null,books:[],ent:[],progress:[],active:null,chapters:[],questions:[],page:0,tab:'library',users:[],target:null,font:18};const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const notify=m=>{let e=$('#message');if(e){e.textContent=m;e.classList.remove('hide')}else alert(m)};
function header(){return '<header class="top"><div class="brand">◈ MENTAL MODELS</div><div class="tabs"><button data-tab="library" class="'+(state.tab==='library'?'active':'')+'">Library</button><button data-tab="progress" class="'+(state.tab==='progress'?'active':'')+'">Progress</button>'+(state.profile?.role==='admin'?'<button data-tab="admin" class="'+(state.tab==='admin'?'active':'')+'">Admin</button>':'')+'<button id="logout">Log out</button></div></header>'}
async function refresh(){let u=state.session.user.id;let r=await Promise.all([db.from('books').select('*').order('id'),db.from('entitlements').select('book_id').eq('user_id',u),db.from('reading_progress').select('*').eq('user_id',u),db.from('profiles').select('*').eq('id',u).single()]);state.books=r[0].data||[];state.ent=(r[1].data||[]).map(x=>x.book_id);state.progress=r[2].data||[];state.profile=r[3].data||null}
const entitled=id=>state.profile?.role==='admin'||state.ent.includes(id);
function render(){const root=$('#app');if(!state.session){root.innerHTML='<div class="login"><div class="eyebrow">PRIVATE LEARNING LIBRARY</div><h1>Think deeper.<br>Live wiser.</h1><p class="muted">Sign in to continue your personal reading journey.</p><div class="message hide" id="message"></div><form id="login"><input type="email" id="email" placeholder="Email address" required><input type="password" id="password" placeholder="Password" required><button class="primary">Sign in</button></form><p class="muted">Your administrator provides account access.</p></div>';$('#login').onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.signInWithPassword({email:$('#email').value,password:$('#password').value});if(error)notify(error.message)};return}let content='';if(state.tab==='library')content=library();if(state.tab==='progress')content=progress();if(state.tab==='reader')content=reader();if(state.tab==='quiz')content=quiz();if(state.tab==='admin')content=admin();root.innerHTML=header()+'<main class="wrap"><div class="message hide" id="message"></div>'+content+'</main>';document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;if(state.tab==='admin')loadUsers();else render()});$('#logout').onclick=()=>db.auth.signOut();document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openBook(+b.dataset.open));wire()}
function library(){let unlocked=state.books.filter(b=>entitled(b.id)),assessed=state.progress.filter(p=>unlocked.some(b=>b.id===p.book_id)&&p.best_score!=null),avg=assessed.length?Math.round(assessed.reduce((n,p)=>n+p.best_score,0)/assessed.length):'—',reading=unlocked.length?Math.round(unlocked.reduce((n,b)=>n+(state.progress.find(p=>p.book_id===b.id)?.completion||0),0)/unlocked.length):0;return '<section class="hero"><div class="eyebrow">YOUR PERSONAL LIBRARY</div><h1>Learn to think differently.</h1><p class="muted">18 mental models. Your pace, your progress, your perspective.</p></section><div class="stats"><div class="stat"><span class="muted">Reading progress</span><strong>'+reading+'%</strong><div class="bar"><i style="width:'+reading+'%"></i></div></div><div class="stat"><span class="muted">Knowledge score</span><strong>'+avg+'/100</strong><small class="muted">'+assessed.length+' books assessed</small></div><div class="stat"><span class="muted">Unlocked books</span><strong>'+unlocked.length+'/18</strong></div></div><h2>Explore your collection</h2><div class="books">'+state.books.map(b=>'<button data-open="'+b.id+'" class="book '+(!entitled(b.id)?'locked':'')+'"><div class="cover" style="--accent:'+esc(b.color)+';--tone:'+esc(b.color)+'24"><small>MENTAL MODEL '+String(b.id).padStart(2,'0')+'</small><h3>'+esc(b.title)+'</h3><small>'+esc(b.description)+'</small></div><p>'+esc(b.title)+'</p><span>'+(entitled(b.id)?(state.progress.find(p=>p.book_id===b.id)?.completion||0)+'% read':'🔒 Locked')+'</span></button>').join('')+'</div>'}
function progress(){let b=state.books.filter(x=>entitled(x.id));return '<div class="eyebrow">LEARNING JOURNEY</div><h1>Your progress</h1><p class="muted">Reading completion and quiz results are tracked separately.</p><div class="panel">'+b.map(x=>{let p=state.progress.find(a=>a.book_id===x.id);return '<div class="listRow"><strong>'+esc(x.title)+'</strong><span>'+(p?.completion||0)+'% read · '+(p?.best_score??'Not assessed')+(p?.best_score==null?'':'/100')+'</span></div>'}).join('')+'</div>'}
async function openBook(id){if(!entitled(id)){notify('This book is locked. Contact the administrator to purchase access.');return}state.active=state.books.find(x=>x.id===id);const r=await db.from('chapters').select('*').eq('book_id',id).order('chapter_number');if(r.error){notify(r.error.message);return}state.chapters=r.data||[];state.page=Math.min(state.chapters.length-1,Math.max(0,state.progress.find(p=>p.book_id===id)?.last_page||0));state.page=Math.max(0,state.page);state.tab='reader';render()}
function reader(){let b=state.active,c=state.chapters[state.page];return '<div class="readerBar"><button class="outline" id="back">← Library</button><b>'+esc(b?.title)+'</b><div><button class="outline" id="smaller">A−</button> <button class="outline" id="larger">A+</button></div></div>'+(!state.chapters.length?'<div class="panel">Content is being prepared. This book is not yet available to read.</div>':'<div class="readerLayout"><aside class="toc">'+state.chapters.map((c,i)=>'<button data-page="'+i+'" class="'+(i===state.page?'active':'')+'">'+(i+1)+'. '+esc(c.title)+'</button>').join('')+'</aside><section><article class="paper" id="paper"><span class="eyebrow">THE MENTAL MODELS LIBRARY</span><p class="muted">CHAPTER '+(state.page+1)+' OF '+state.chapters.length+'</p><h1>'+esc(c?.title)+'</h1><div class="chapter" style="font-size:'+state.font+'px">'+DOMPurify.sanitize(marked.parse(c?.content||''))+'</div></article><div class="readerFoot"><button class="outline" id="prev" '+(state.page===0?'disabled':'')+'>← Previous</button><span class="muted">'+(state.page+1)+' / '+state.chapters.length+'</span>'+(state.page===state.chapters.length-1?'<button class="primary" id="takequiz">Take quiz →</button>':'<button class="primary" id="next">Next →</button>')+'</div></section></div>')}
async function goPage(n){if(n<0||n>=state.chapters.length)return;state.page=n;const id=state.active.id,old=state.progress.find(p=>p.book_id===id),furthest=Math.max(old?.furthest_page||0,n),completion=Math.round((furthest+1)/state.chapters.length*100);await db.from('reading_progress').upsert({user_id:state.session.user.id,book_id:id,last_page:n,furthest_page:furthest,completion,updated_at:new Date().toISOString()},{onConflict:'user_id,book_id'});if(old)Object.assign(old,{last_page:n,furthest_page:furthest,completion});else state.progress.push({book_id:id,last_page:n,furthest_page:furthest,completion});render();window.scrollTo(0,0)}
async function startQuiz(){const r=await db.from('quiz_public').select('id,book_id,order_number,prompt,options').eq('book_id',state.active.id).order('order_number');state.questions=r.data||[];state.tab='quiz';render()}
function quiz(){return '<button id="back" class="outline">← Reader</button><h1>'+esc(state.active?.title)+' — Quiz</h1><p class="muted">10 questions · 100 points · Retakes allowed</p><form id="quizform">'+state.questions.map((q,i)=>'<div class="question"><b>'+(i+1)+'. '+esc(q.prompt)+'</b>'+q.options.map((o,j)=>'<label class="option"><input type="radio" required name="'+esc(q.id)+'" value="'+j+'">'+esc(o)+'</label>').join('')+'</div>').join('')+'<button class="primary" '+(!state.questions.length?'disabled':'')+'>Submit answers</button></form>'}
async function loadUsers(){const r=await db.rpc('admin_user_overview');if(r.error){notify(r.error.message);return}state.users=r.data||[];state.tab='admin';render()}
function admin(){return '<div class="eyebrow">ADMIN CONTROL</div><h1>Manage your readers</h1><p class="muted">Create a customer login and unlock purchased books instantly.</p><div class="panel"><h2>Create Customer Account</h2><form id="createform"><label>Email address<input type="email" id="newemail" required placeholder="customer@gmail.com" autocomplete="off"></label><label>Temporary password<input type="text" id="newpassword" minlength="12" required placeholder="At least 12 characters" autocomplete="off"></label><button type="button" class="outline" id="generatepwd">Generate strong password</button><h3>Purchased books</h3><div class="perm">'+state.books.map(b=>'<label><input type="checkbox" data-newbook="'+b.id+'"> '+esc(b.title)+'</label>').join('')+'</div><p class="muted">Select at least one book. Password is only displayed during account creation.</p><button class="primary" id="createbtn">Create account & grant access</button></form><div id="createdresult" class="message hide"></div></div><div class="panel" style="margin-top:18px"><h2>Existing Customer Permissions</h2><select id="userselect"><option value="">Choose customer</option>'+state.users.map(u=>'<option value="'+esc(u.id)+'" '+(state.target===u.id?'selected':'')+'>'+esc(u.email)+' ('+u.book_count+' books)</option>').join('')+'</select><div class="perm">'+(state.target?state.books.map(b=>'<label><input type="checkbox" data-perm="'+b.id+'" '+(state.users.find(u=>u.id===state.target)?.book_ids.includes(b.id)?'checked':'')+'> '+esc(b.title)+'</label>').join(''):'Select a customer to assign access.')+'</div></div>'}
function wire(){if(state.tab==='reader'){let back=$('#back');if(back)back.onclick=()=>{state.tab='library';render()};document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>goPage(+b.dataset.page));if($('#prev'))$('#prev').onclick=()=>goPage(state.page-1);if($('#next'))$('#next').onclick=()=>goPage(state.page+1);if($('#takequiz'))$('#takequiz').onclick=startQuiz;if($('#smaller'))$('#smaller').onclick=()=>{state.font=Math.max(14,state.font-2);render()};if($('#larger'))$('#larger').onclick=()=>{state.font=Math.min(27,state.font+2);render()};let startX=0,startY=0,paper=$('#paper');if(paper){paper.ontouchstart=e=>{startX=e.changedTouches[0].clientX;startY=e.changedTouches[0].clientY};paper.ontouchend=e=>{let dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>85&&Math.abs(dx)>Math.abs(dy)*1.5)goPage(state.page+(dx<0?1:-1))}}}if(state.tab==='quiz'){if($('#back'))$('#back').onclick=()=>{state.tab='reader';render()};if($('#quizform'))$('#quizform').onsubmit=async e=>{e.preventDefault();let data=new FormData(e.target),answers={};state.questions.forEach(q=>answers[q.id]=+data.get(q.id));const r=await db.rpc('submit_quiz',{p_book_id:state.active.id,p_answers:answers});if(r.error){notify(r.error.message);return}alert('Your score: '+r.data.score+'/100');await refresh();state.tab='progress';render()}}if(state.tab==='admin'){if($('#userselect'))$('#userselect').onchange=e=>{state.target=e.target.value;render()};document.querySelectorAll('[data-perm]').forEach(el=>el.onchange=async()=>{let r=await db.rpc('admin_set_entitlement',{p_user_id:state.target,p_book_id:+el.dataset.perm,p_grant:el.checked});if(r.error)notify(r.error.message);else await loadUsers()});if($('#generatepwd'))$('#generatepwd').onclick=()=>{$('#newpassword').value='Mm!'+Array.from(crypto.getRandomValues(new Uint8Array(18)),n=>'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$'[n%60]).join('')};if($('#createform'))$('#createform').onsubmit=async e=>{e.preventDefault();const email=$('#newemail').value.trim(),password=$('#newpassword').value;const ids=[...document.querySelectorAll('[data-newbook]:checked')].map(x=>Number(x.dataset.newbook));if(!ids.length){notify('Select at least one book');return}const btn=$('#createbtn');btn.disabled=true;try{const {data}=await db.auth.getSession();const r=await fetch(SB+'/functions/v1/create-customer',{method:'POST',headers:{Authorization:'Bearer '+data.session.access_token,apikey:PK,'Content-Type':'application/json'},body:JSON.stringify({email,password,book_ids:ids})});const x=await r.json().catch(()=>({}));if(!r.ok){notify(x.error||'Unable to create customer');return}const message='Your Mental Models Library access is ready!\\nWebsite: https://demoaccountdfe545.github.io/mental-models-library/\\nEmail: '+email+'\\nTemporary password: '+password+'\\nBooks: '+state.books.filter(b=>ids.includes(b.id)).map(b=>b.title).join(', ')+'\\nPlease change your password after signing in.';const box=$('#createdresult');box.classList.remove('hide');box.textContent='Customer account created successfully. Copy and share the details securely. ';const copy=document.createElement('button');copy.className='outline';copy.type='button';copy.textContent='Copy WhatsApp Message';copy.onclick=()=>navigator.clipboard.writeText(message).then(()=>notify('Message copied'));box.append(copy);$('#createform').reset();state.users=(await db.rpc('admin_user_overview')).data||state.users;}catch(err){notify('Network error creating account')}finally{btn.disabled=false}}}}}
async function init(){const {data}=await db.auth.getSession();state.session=data.session;if(state.session)await refresh();render();db.auth.onAuthStateChange(async(_e,s)=>{state.session=s;state.tab='library';if(s)await refresh();render()})}init();
</script></body></html>
